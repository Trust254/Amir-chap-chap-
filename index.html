<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amir Chap Chap</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
    }
    .header span {
      color: var(--primary);
    }
    .nav-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .nav-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 12px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      background: #0f172a;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-warning {
      background: var(--primary);
      color: #000;
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .order-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: #e2e8f0;
      text-transform: capitalize;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="header">
    <h1>Amir <span>Chap Chap</span></h1>
    <p style="color: var(--text-muted); font-size: 14px;">Fast & Reliable Service</p>
  </div>

  <div class="nav-buttons">
    <button class="nav-btn" onclick="showSection('authSection')">Login / Register</button>
    <button class="nav-btn" onclick="showSection('customerSection')">Customer</button>
    <button class="nav-btn" onclick="showSection('moderatorSection')">Moderator</button>
  </div>

  <div id="authSection" class="card">
    <h3>Customer Portal Access</h3>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="authEmail" placeholder="e.g. user@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label>Phone Number (Required for New Register)</label>
      <input type="tel" id="authPhone" placeholder="0712345678">
    </div>
    <button class="btn" onclick="handleLogin()">Login</button>
    <button class="btn btn-warning" style="margin-top: 8px;" onclick="handleRegister()">Register & Auto-Login</button>
  </div>

  <div id="customerSection" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Customer Portal</h3>
      <button class="btn btn-danger" style="width: auto; padding: 6px 12px;" onclick="handleLogout()">Logout</button>
    </div>

    <h4>Book a Service</h4>
    <div class="form-group">
      <label>Service Type</label>
      <select id="custService">
        <option value="Delivery">Delivery</option>
        <option value="Passenger Transport">Passenger Transport</option>
      </select>
    </div>
    <div class="form-group">
      <label>Pickup Location</label>
      <input type="text" id="custPickup" placeholder="Example: Lenana" required>
    </div>
    <div class="form-group">
      <label>Destination</label>
      <input type="text" id="custDestination" placeholder="Example: Naivas" required>
    </div>
    <div class="form-group">
      <label>Phone Number / WhatsApp</label>
      <input type="tel" id="custPhone" placeholder="Example: 0712345678" required>
    </div>
    <div class="form-group">
      <label>Distance in KM</label>
      <input type="number" id="custDistance" placeholder="Example: 5" required>
    </div>
    <button class="btn btn-warning" onclick="submitCustomerOrder()">Submit Order for Price Quote</button>

    <h4 style="margin-top: 24px;">My Orders</h4>
    <div id="customerOrdersList">Loading orders...</div>
  </div>

  <div id="moderatorSection" class="card" style="display: none;">
    <h3>All Orders & Fare Control</h3>
    <button class="btn" onclick="loadModeratorOrders()">Refresh Orders</button>
    <div id="moderatorOrdersList" style="margin-top: 16px;">Loading orders...</div>
  </div>

  <script>
    // 1. YOUR BACKEND API BASE URL
    const API_BASE_URL = "https://amir-chap-chap-backend.onrender.com";

    // 2. YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);

    // PERSISTENCE & AUTO LOGIN MONITOR
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        showSection('customerSection');
        loadCustomerOrders();
      } else {
        showSection('authSection');
      }
    });

    function showSection(sectionId) {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('customerSection').style.display = 'none';
      document.getElementById('moderatorSection').style.display = 'none';
      document.getElementById(sectionId).style.display = 'block';

      if (sectionId === 'moderatorSection') loadModeratorOrders();
    }

    // AUTHENTICATION LOGIC
    async function handleRegister() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const phone = document.getElementById('authPhone').value;

      if (!phone) return alert("Please enter your phone number to register.");

      try {
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const token = await userCredential.user.getIdToken();

        await fetch(`${API_BASE_URL}/api/customer/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ phone })
        });

        alert("Registration successful! Logging you in...");
      } catch (err) {
        alert("Registration failed: " + err.message);
      }
    }

    async function handleLogin() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    }

    async function handleLogout() {
      await firebase.auth().signOut();
    }

    // CUSTOMER ORDER SUBMISSION
    async function submitCustomerOrder() {
      const pickup = document.getElementById('custPickup').value;
      const destination = document.getElementById('custDestination').value;
      const phone = document.getElementById('custPhone').value;
      const distance = document.getElementById('custDistance').value;

      const user = firebase.auth().currentUser;
      if (!user) return alert("You must be logged in.");

      const token = await user.getIdToken();

      try {
        const res = await fetch(`${API_BASE_URL}/api/customer/orders`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ pickup, destination, phone, distance })
        });

        if (!res.ok) throw new Error("Order submission failed");
        alert("Order submitted! The moderator will review and set the fair price.");
        loadCustomerOrders();
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadCustomerOrders() {
      const user = firebase.auth().currentUser;
      if (!user) return;
      const token = await user.getIdToken();

      const res = await fetch(`${API_BASE_URL}/api/customer/orders`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();

      const listDiv = document.getElementById('customerOrdersList');
      if (!data.orders || data.orders.length === 0) {
        listDiv.innerHTML = "<p>No orders placed yet.</p>";
        return;
      }

      listDiv.innerHTML = data.orders.map(o => `
        <div class="order-item">
          <strong>${o.pickup} → ${o.destination}</strong><br>
          Phone: ${o.customerPhone || 'N/A'}<br>
          Fare: <strong>KSh ${o.fare || 0}</strong><br>
          Status: <span class="status-tag">${o.status}</span>
        </div>
      `).join('');
    }

    // MODERATOR FARE CONTROL
    async function loadModeratorOrders() {
      const user = firebase.auth().currentUser;
      if (!user) return alert("Please log in as a moderator first.");
      const token = await user.getIdToken();

      const res = await fetch(`${API_BASE_URL}/api/moderator/orders`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();

      const listDiv = document.getElementById('moderatorOrdersList');
      if (!data.orders || data.orders.length === 0) {
        listDiv.innerHTML = "<p>No orders available.</p>";
        return;
      }

      listDiv.innerHTML = data.orders.map(o => `
        <div class="order-item">
          <strong>${o.pickup} → ${o.destination}</strong><br>
          Customer: ${o.customerEmail} (${o.customerPhone || 'No Phone'})<br>
          Original Fare: KSh ${o.originalFare || 0} | Transport: KSh ${o.transportCharge || 0}<br>
          Final Fare: <strong>KSh ${o.fare || 0}</strong> | Status: <span class="status-tag">${o.status}</span>
          <hr style="margin: 8px 0;">
          <div class="form-group">
            <input type="number" id="orig_${o.id}" placeholder="Original Fare (KSh)" value="${o.originalFare || ''}">
          </div>
          <div class="form-group">
            <input type="number" id="trans_${o.id}" placeholder="Transport Charge (KSh)" value="${o.transportCharge || ''}">
          </div>
          <button class="btn btn-warning" onclick="updateModeratorFare('${o.id}')">Update Fare</button>
          <button class="btn" style="margin-top: 6px;" onclick="approveOrder('${o.id}')">Approve Order</button>
        </div>
      `).join('');
    }

    async function updateModeratorFare(orderId) {
      const originalFare = document.getElementById(`orig_${orderId}`).value;
      const transportCharge = document.getElementById(`trans_${orderId}`).value;

      const user = firebase.auth().currentUser;
      const token = await user.getIdToken();

      try {
        const res = await fetch(`${API_BASE_URL}/api/moderator/orders/${orderId}/fare`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ originalFare, transportCharge })
        });

        if (!res.ok) throw new Error("Could not update fare");
        alert("Fare updated successfully!");
        loadModeratorOrders();
      } catch (err) {
        alert("Could not update fare: " + err.message);
      }
    }

    async function approveOrder(orderId) {
      const user = firebase.auth().currentUser;
      const token = await user.getIdToken();

      const res = await fetch(`${API_BASE_URL}/api/moderator/orders/${orderId}/approve`, {
        method: "PATCH",
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (res.ok) {
        alert("Order approved!");
        loadModeratorOrders();
      }
    }
  </script>
</body>
</html>
