<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a7c36">
<meta name="description" content="Amir Chap Chap - Fast delivery, pickup and parcel services in Kenya">
<title>Amir Chap Chap | Delivery & Pickup</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQ3g8Q3j1K9Lx9Q8zX0X0X0X0X0X0X0="
      crossorigin="">

<style>
:root{
    --green:#0a7c36;
    --dark-green:#064c21;
    --yellow:#ffc700;
    --white:#fff;
    --light:#f4f8f5;
    --dark:#121c16;
    --gray:#626e67;
    --border:#dfe8e2;
    --danger:#d93025;
    --blue:#1677ff;
    --orange:#ff9800;
    --shadow:0 12px 35px rgba(0,0,0,.09);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:var(--dark);
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.top-strip{
    height:8px;
    background:linear-gradient(90deg,var(--green) 70%,var(--yellow) 30%);
}

/* NAV */
nav{
    min-height:75px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:12px 6%;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:23px;
    font-weight:900;
    color:var(--green);
    white-space:nowrap;
}

.logo-img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--yellow);
}

.nav-links{
    display:flex;
    gap:20px;
    align-items:center;
    flex-wrap:wrap;
}

.nav-links a{
    text-decoration:none;
    color:var(--dark);
    font-weight:700;
}

.user-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-badge{
    background:#e8f6ed;
    color:var(--green);
    padding:8px 14px;
    border-radius:20px;
    font-weight:bold;
    font-size:14px;
}

.nav-btn{
    border:none;
    padding:11px 18px;
    border-radius:12px;
    background:var(--green);
    color:white;
    font-weight:bold;
}

/* HERO */
.hero{
    min-height:540px;
    background:
        radial-gradient(circle at 80% 30%,rgba(255,199,0,.25),transparent 30%),
        linear-gradient(135deg,#fafffc,#eaf8ef);
    padding:60px 6%;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:40px;
}

.hero h1{
    font-size:clamp(38px,4.5vw,65px);
    line-height:1.05;
    margin-bottom:20px;
}

.hero h1 span{
    color:var(--green);
}

.hero p{
    font-size:18px;
    line-height:1.6;
    color:var(--gray);
    max-width:600px;
    margin-bottom:25px;
}

.hero-buttons{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    padding:14px 22px;
    border-radius:14px;
    border:none;
    font-weight:800;
}

.primary-btn{
    background:var(--green);
    color:white;
}

.secondary-btn{
    background:var(--yellow);
    color:var(--dark);
}

.hero-logo-display{
    max-width:440px;
    width:100%;
    border-radius:50%;
    box-shadow:0 15px 35px rgba(10,124,54,.2);
    border:6px solid white;
}

/* GENERAL */
section{
    padding:70px 6%;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.section-title h2{
    font-size:36px;
    margin-bottom:10px;
}

.section-title p{
    color:var(--gray);
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid var(--border);
    background:#fff;
    padding:13px;
    border-radius:11px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(10,124,54,.1);
}

/* AUTH */
#authSection{
    display:none;
}

.auth-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:var(--shadow);
    max-width:430px;
    margin:0 auto;
}

.auth-tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.auth-tab{
    flex:1;
    padding:11px;
    border:1px solid var(--border);
    background:var(--light);
    border-radius:10px;
    font-weight:bold;
}

.auth-tab.active{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

/* ORDER */
.order-layout{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:.75fr 1.25fr;
    gap:30px;
}

.order-menu,
.order-form,
.tracker-card,
.admin-card,
.order-history-card{
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:var(--shadow);
}

.category-btn{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    background:var(--light);
    border-radius:13px;
    text-align:left;
    margin-bottom:10px;
    font-weight:bold;
}

.category-btn.active{
    background:var(--green);
    color:white;
}

/* PAYMENT */
.payment-box{
    margin:20px 0;
    padding:20px;
    border-radius:16px;
    background:#eef9f1;
    border:1px solid #cdebd6;
}

.payment-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:12px;
}

.mpesa-number{
    display:block;
    font-size:27px;
    color:var(--green);
    font-weight:900;
    letter-spacing:1px;
    margin:10px 0;
}
