<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amir Chap Chap | Fast Delivery</title>

<meta name="description"
content="Amir Chap Chap fast food, parcel and shopping delivery services.">

<meta name="theme-color" content="#0a7c36">

<style>

:root{
--green:#0a7c36;
--dark-green:#064c21;
--yellow:#ffc700;
--white:#ffffff;
--light:#f4f8f5;
--dark:#121c16;
--gray:#626e67;
--border:#dfe8e2;
--danger:#d93025;
--blue:#1976d2;
--orange:#ff9800;
--shadow:0 12px 35px rgba(0,0,0,.09);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--light);
color:var(--dark);
line-height:1.5;
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

.top-strip{
height:8px;
background:linear-gradient(
90deg,
var(--green) 70%,
var(--yellow) 70%
);
}

/* =========================
NAVIGATION
========================= */

nav{
min-height:75px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
gap:18px;
padding:10px 6%;
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:1000;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:22px;
font-weight:900;
color:var(--green);
}

.logo img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--yellow);
}

.nav-links{
display:flex;
gap:18px;
flex-wrap:wrap;
}

.nav-links a{
color:var(--dark);
text-decoration:none;
font-weight:700;
}

.nav-links a:hover{
color:var(--green);
}

.nav-btn,
.primary-btn,
.secondary-btn,
.submit-btn{
border:0;
border-radius:12px;
padding:13px 18px;
font-weight:800;
}

.nav-btn,
.primary-btn,
.submit-btn{
background:var(--green);
color:white;
}

.secondary-btn{
background:var(--yellow);
color:var(--dark);
}

button:hover{
opacity:.92;
}

/* =========================
HERO
========================= */

.hero{
min-height:540px;
padding:60px 6%;
display:grid;
grid-template-columns:1.05fr .95fr;
gap:40px;
align-items:center;

background:
radial-gradient(
circle at 80% 30%,
rgba(255,199,0,.25),
transparent 30%
),
linear-gradient(
135deg,
#fafffc,
#eaf8ef
);
}

.hero h1{
font-size:clamp(38px,5vw,64px);
line-height:1.05;
margin:15px 0 20px;
}

.hero h1 span{
color:var(--green);
}

.hero p{
font-size:18px;
color:var(--gray);
max-width:650px;
margin-bottom:25px;
}

.hero-buttons{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.hero-logo{
width:100%;
max-width:420px;
border-radius:50%;
border:6px solid white;
box-shadow:
0 15px 35px rgba(10,124,54,.2);
}

.badge{
display:inline-block;
padding:7px 14px;
border-radius:20px;
background:var(--yellow);
font-size:13px;
font-weight:800;
}

/* =========================
SECTIONS
========================= */

section{
padding:65px 6%;
}

.section-title{
text-align:center;
margin-bottom:35px;
}

.section-title h2{
font-size:34px;
margin-bottom:8px;
}

.section-title p{
color:var(--gray);
}

.card{
background:white;
border-radius:22px;
padding:28px;
box-shadow:var(--shadow);
}

/* =========================
ORDER
========================= */

.order-layout{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:.7fr 1.3fr;
gap:25px;
}

.service{
width:100%;
padding:14px;
margin-bottom:10px;
border-radius:12px;
border:1px solid var(--border);
background:var(--light);
text-align:left;
font-weight:800;
}

.service.active{
background:var(--green);
color:white;
border-color:var(--green);
}

.service-description{
margin-top:20px;
padding:15px;
background:#fff8db;
border-radius:12px;
font-size:14px;
}

.form-group{
margin-bottom:17px;
}

label{
display:block;
font-weight:800;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:13px;
border:1px solid var(--border);
border-radius:10px;
background:#fbfdfb;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--green);
box-shadow:
0 0 0 3px rgba(10,124,54,.08);
}

.small{
font-size:13px;
color:var(--gray);
margin-top:5px;
}

/* =========================
PAYMENT
========================= */

.payment-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.payment-option{
border:1px solid var(--border);
border-radius:12px;
padding:14px;
background:white;
cursor:pointer;
}

.payment-option input{
width:auto;
margin-right:8px;
}

.payment-option.selected{
border-color:var(--green);
background:#eaf8ef;
}

.mpesa-box{
display:none;
margin-top:12px;
padding:15px;
border-radius:12px;
background:#eaf8ef;
}

.mpesa-box.show{
display:block;
}

/* =========================
RESULT
========================= */

.result{
display:none;
max-width:1100px;
margin:25px auto 0;
padding:25px;
background:#e8f6ed;
border:1px solid #b8dfc4;
border-radius:18px;
}

.result.show{
display:block;
}

.order-id{
font-size:25px;
font-weight:900;
color:var(--green);
margin:5px 0 15px;
}

.whatsapp{
display:inline-block;
margin-top:15px;
padding:13px 18px;
background:#25d366;
color:white;
border-radius:12px;
text-decoration:none;
font-weight:800;
}

.whatsapp:hover{
opacity:.9;
}

/* =========================
TRACKING
========================= */

.tracking{
background:#eef9f1;
}

.tracking-card{
max-width:1100px;
margin:auto;
}

.tracking-box{
background:white;
padding:25px;
border-radius:22px;
box-shadow:var(--shadow);
}

.status{
display:inline-block;
padding:7px 14px;
border-radius:20px;
background:var(--yellow);
font-weight:800;
font-size:13px;
}

.status.blue{
background:var(--blue);
color:white;
}

.status.orange{
background:var(--orange);
color:white;
}

.status.green{
background:var(--green);
color:white;
}

.map-placeholder{
height:300px;
margin-top:20px;
border-radius:16px;
background:
linear-gradient(
135deg,
#dff2e4,
#f8fff9
);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--gray);
padding:20px;
}

.order-details{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.detail{
background:var(--light);
padding:14px;
border-radius:12px;
}

.detail small{
display:block;
color:var(--gray);
}

.detail strong{
display:block;
margin-top:3px;
}

/* =========================
ADMIN
========================= */

.admin{
background:var(--dark);
color:white;
}

.admin-card{
max-width:500px;
margin:auto;
background:#173025;
padding:28px;
border-radius:22px;
}

.admin-card input{
margin-bottom:12px;
background:white;
}

.admin-message{
margin-top:15px;
padding:13px;
border-radius:10px;
display:none;
}

.admin-message.show{
display:block;
}

.admin-dashboard{
display:none;
max-width:1100px;
margin:25px auto 0;
}

.admin-dashboard.show{
display:block;
}

.admin-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:15px 0;
}

.admin-stat-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:20px;
}

.admin-stat{
background:var(--light);
padding:18px;
border-radius:12px;
color:var(--dark);
}

.admin-stat strong{
font-size:25px;
display:block;
color:var(--green);
}

.table-wrapper{
overflow-x:auto;
}

.admin-table{
width:100%;
border-collapse:collapse;
background:white;
color:var(--dark);
border-radius:12px;
overflow:hidden;
}

.admin-table th,
.admin-table td{
padding:12px;
border-bottom:1px solid var(--border);
text-align:left;
white-space:nowrap;
}

.admin-table th{
background:#eaf8ef;
}

.table-btn{
border:0;
border-radius:8px;
padding:7px 10px;
background:var(--green);
color:white;
font-weight:bold;
}

.table-btn.danger{
background:var(--danger);
}

/* =========================
RIDER
========================= */

.rider-section{
background:#f9fbfa;
}

.rider-card{
max-width:900px;
margin:auto;
}

.rider-login{
max-width:450px;
margin:auto;
}

.rider-panel{
display:none;
}

.rider-panel.show{
display:block;
}

.rider-job{
background:white;
border-radius:20px;
padding:25px;
box-shadow:var(--shadow);
margin-top:20px;
}

.rider-status{
display:inline-block;
padding:7px 13px;
border-radius:20px;
background:var(--yellow);
font-weight:800;
}

.rider-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.rider-buttons button{
padding:14px;
border:0;
border-radius:12px;
font-weight:800;
}

/* =========================
FOOTER
========================= */

footer{
background:#121c16;
color:white;
padding:35px 6%;
text-align:center;
}

footer p{
color:#b8c3bc;
margin-top:7px;
}

/* =========================
TOAST
========================= */

.toast{
position:fixed;
bottom:20px;
left:20px;
right:20px;
max-width:500px;
margin:auto;
padding:15px 20px;
background:#121c16;
color:white;
border-radius:12px;
display:none;
z-index:3000;
text-align:center;
}

.toast.show{
display:block;
}

/* =========================
MODAL
========================= */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:2000;
align-items:center;
justify-content:center;
padding:20px;
}

.modal.show{
display:flex;
}

.modal-box{
background:white;
padding:28px;
border-radius:20px;
width:100%;
max-width:450px;
position:relative;
}

.close{
position:absolute;
right:15px;
top:10px;
border:0;
background:none;
font-size:25px;
}

/* =========================
MOBILE
========================= */

@media(max-width:850px){

.hero,
.order-layout{
grid-template-columns:1fr;
}

.nav-links{
order:3;
width:100%;
justify-content:center;
}

nav{
flex-wrap:wrap;
}

.admin-stat-grid{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:520px){

section{
padding:50px 4%;
}

nav{
padding:10px 4%;
}

.logo{
font-size:18px;
}

.payment-options{
grid-template-columns:1fr;
}

.order-details{
grid-template-columns:1fr;
}

.rider-buttons{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="top-strip"></div>

<!-- =========================
NAVIGATION
========================= -->

<nav>

<div class="logo">

<img
src="1000369432.png"
alt="Amir Chap Chap logo"
onerror="this.style.display='none'"
>

Amir Chap Chap

</div>

<div class="nav-links">

<a href="#order">Order</a>

<a href="#tracking">Track</a>

<a href="#rider">Rider</a>

<a href="#admin">Admin</a>

</div>

<button
class="nav-btn"
onclick="scrollToId('order')"
>
Order Now
</button>

</nav>


<!-- =========================
HERO
========================= -->

<header class="hero">

<div>

<span class="badge">
⚡ FAST LOCAL DELIVERY
</span>

<h1>
Fast pickup,
<span>simple delivery.</span>
</h1>

<p>
Amir Chap Chap connects customers with
